<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Weather App</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<!-- =========================
     SIDEBAR
========================== -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

        <button id="menuBtn" class="menu-btn" title="Toggle Sidebar">
            ☰
        </button>

        <div class="sidebar-logo">
            <span>🌤️</span>
            <span class="sidebar-title">Weather</span>
        </div>

    </div>


    <div class="sidebar-content">

        <!-- Favorite Cities -->

        <div class="sidebar-section">

            <h3>
                <span>⭐</span>
                <span class="sidebar-text">Favorite Cities</span>
            </h3>

            <div id="favoriteList">
                <p class="empty-message sidebar-text">
                    No favorite cities
                </p>
            </div>

        </div>


        <!-- Search History -->

        <div class="sidebar-section">

            <h3>
                <span>🕘</span>
                <span class="sidebar-text">Search History</span>
            </h3>

            <div id="historyList">
                <p class="empty-message sidebar-text">
                    No search history
                </p>
            </div>

        </div>

    </div>

</aside>


<!-- =========================
     MAIN CONTENT
========================== -->

<main class="main-content" id="mainContent">

    <div class="weather-container">

        <!-- Navbar -->

        <nav class="navbar">

            <div class="navbar-title">
                <span>🌤️</span>
                <span>Weather App</span>
            </div>

            <div class="navbar-status">
                Live Weather
            </div>

        </nav>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

            <button id="locationBtn">
                📍 My Location
            </button>

        </div>


        <!-- Loading -->

        <p id="loading" style="display: none;">
            ⏳ Loading weather...
        </p>


        <!-- Current Weather -->

        <div class="weather-card">

            <div class="city-title">

                <h2 id="cityName">
                    Dhaka
                </h2>

                <button
                    id="favoriteBtn"
                    title="Add to favorites"
                >
                    ☆
                </button>

            </div>


            <div
                class="weather-icon"
                id="weatherIcon"
            >
                ☀️
            </div>


            <h3 id="temperature">
                28°C
            </h3>


            <button id="unitBtn">
                Switch to °F
            </button>


            <p id="condition">
                Sunny
            </p>


            <!-- Weather Info -->

            <div class="weather-info">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">
                        65%
                    </strong>
                </div>


                <div>
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">
                        12 km/h
                    </strong>
                </div>


                <div>
                    <span>🌅</span>
                    <p>Sunrise</p>
                    <strong id="sunrise">
                        --:--
                    </strong>
                </div>


                <div>
                    <span>🌇</span>
                    <p>Sunset</p>
                    <strong id="sunset">
                        --:--
                    </strong>
                </div>

            </div>

        </div>


        <!-- Forecast -->

        <div class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div
                class="forecast-container"
                id="forecastContainer"
            >
            </div>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
