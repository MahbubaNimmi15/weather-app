
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <h1>Weather App</h1>


        <!-- Search Box -->
        <div class="search-box">

            <input
                type="text"
                placeholder="Enter city name"
                id="cityInput"
            >

            <button id="searchBtn">
                Search
            </button>

            <button id="locationBtn">
                📍 My Location
            </button>

        </div>


        <!-- Loading Message -->
        <p id="loading" style="display: none;">
            ⏳ Loading weather...
        </p>


        <!-- Favorite Cities -->
        <div class="favorite-section">

            <h2>⭐ Favorite Cities</h2>

            <div
                class="favorite-container"
                id="favoriteContainer"
            >
                <!-- Favorite cities will appear here -->
            </div>

        </div>


        <!-- Current Weather Card -->
        <div class="weather-card">

            <h2 id="cityName">
                Dhaka
            </h2>

            <div class="weather-icon" id="weatherIcon">
                ☀️
            </div>

            <h3 id="temperature">
                28°C
            </h3>


            <!-- Temperature Unit Button -->
            <button id="unitBtn">
                Switch to °F
            </button>


            <!-- Favorite Button -->
            <button id="favoriteBtn">
                ⭐ Add to Favorites
            </button>


            <p id="condition">
                Sunny
            </p>


            <!-- Weather Information -->
            <div class="weather-info">

                <div>

                    <span>💧</span>

                    <p>
                        Humidity
                    </p>

                    <strong id="humidity">
                        65%
                    </strong>

                </div>


                <div>

                    <span>💨</span>

                    <p>
                        Wind
                    </p>

                    <strong id="wind">
                        12 km/h
                    </strong>

                </div>

            </div>

        </div>


        <!-- 5-Day Forecast -->
        <div class="forecast-section">

            <h2>
                5-Day Forecast
            </h2>

            <div
                class="forecast-container"
                id="forecastContainer"
            >

                <!-- Forecast cards will appear here -->

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
