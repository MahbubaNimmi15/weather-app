<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <button id="menuBtn" class="menu-btn">
            ☰
        </button>

        <div class="logo">
            🌤️ Weather App
        </div>

        <button id="themeBtn" class="theme-btn">
            🌙
        </button>

    </header>


    <!-- =========================
         SIDEBAR OVERLAY
    ========================== -->

    <div id="overlay" class="overlay"></div>


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <h2>🌤️ Weather</h2>

            <button id="closeBtn" class="close-btn">
                ✕
            </button>

        </div>


        <!-- Favorite Cities -->

        <div class="sidebar-section">

            <h3>⭐ Favorite Cities</h3>

            <div id="favoriteList">
                <p class="empty-message">
                    No favorite cities
                </p>
            </div>

        </div>


        <!-- Search History -->

        <div class="sidebar-section">

            <h3>🕘 Search History</h3>

            <div id="historyList">
                <p class="empty-message">
                    No search history
                </p>
            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <div class="weather-container">

            <h1>Weather App</h1>


            <!-- Search -->

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >

                <button id="searchBtn">
                    Search
                </button>

                <button id="locationBtn">
                    📍 My Location
                </button>

            </div>


            <!-- Loading -->

            <p id="loading">
                ⏳ Loading weather...
            </p>


            <!-- Current Weather -->

            <div class="weather-card">

                <div class="city-title">

                    <h2 id="cityName">
                        Dhaka
                    </h2>

                    <button
                        id="favoriteBtn"
                        title="Add to favorites"
                    >
                        ☆
                    </button>

                </div>


                <div
                    id="weatherIcon"
                    class="weather-icon"
                >
                    ☀️
                </div>


                <h3 id="temperature">
                    28°C
                </h3>


                <button id="unitBtn">
                    Switch to °F
                </button>


                <p id="condition">
                    Sunny
                </p>


                <!-- Weather Information -->

                <div class="weather-info">

                    <div>

                        <span>💧</span>

                        <p>Humidity</p>

                        <strong id="humidity">
                            65%
                        </strong>

                    </div>


                    <div>

                        <span>💨</span>

                        <p>Wind</p>

                        <strong id="wind">
                            12 km/h
                        </strong>

                    </div>


                    <div>

                        <span>🌅</span>

                        <p>Sunrise</p>

                        <strong id="sunrise">
                            --:--
                        </strong>

                    </div>


                    <div>

                        <span>🌇</span>

                        <p>Sunset</p>

                        <strong id="sunset">
                            --:--
                        </strong>

                    </div>

                </div>

            </div>


            <!-- =========================
                 FORECAST
            ========================== -->

            <div class="forecast-section">

                <h2>5-Day Forecast</h2>

                <div
                    id="forecastContainer"
                    class="forecast-container"
                ></div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

    
</body>

</html>
